<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeMania</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/snake.png" type="image/png">

</head>
<body>
    <div id="body">
        <div id="scoreBox">Score: 0</div>
        <div id="hiscoreBox">Hiscore:0</div>
        <button id="modeBox">Change Difficulty</button>
        <div id="currentDiff">Difficulty:Medium</div>
        <div id="board"></div>
        <!-- Game Over Modal -->
        <div id="modal-overlay" class="modal-overlay hidden"></div>
        <div id="modal-alert" class="modal-alert hidden">
            <h2 id="gameOver">Game Over</h2>
            <p id="alert-message">Your score: <span id="final-score">0</span></p>
            <button id="playAgainBtn" class="alert-button">Play Again</button>
        </div>

        
    </div>
</body>
<script src="script.js"></script>
</html>
